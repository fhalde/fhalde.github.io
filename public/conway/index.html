<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life</title>
<style>
  :root{
    --paper:      #efe7d5;   /* 宣纸 rice paper */
    --paper-2:    #e6dcc4;   /* subtle panel */
    --ink:        #23211c;   /* 墨 ink */
    --ink-soft:   #4a463d;
    --line:       #b9ac8f;   /* grid lines */
    --vermilion:  #a52a24;   /* 朱砂 cinnabar */
    --vermilion-2:#c1443a;
    --celadon:    #6d8a72;   /* 青 celadon */
    --ochre:      #8a6d3b;   /* 赭石 ochre */
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(138,109,59,.10), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:Georgia, "Times New Roman", "Iowan Old Style", serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding:32px 16px 48px;
    gap:20px;
  }
  header{ text-align:center; }
  h1{
    margin:0;
    font-size:34px;
    letter-spacing:.35em;
    font-weight:600;
  }
  .sub{
    margin-top:6px;
    font-size:12px;
    letter-spacing:.45em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .board{
    position:relative;
    padding:14px;
    background:var(--paper-2);
    border:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 6px 22px rgba(35,33,28,.10);
  }
  canvas{ display:block; }
  .banner{
    position:absolute;
    inset:14px;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(239,231,213,.82);
    backdrop-filter:blur(1px);
    pointer-events:none;
  }
  .banner .seal{
    background:var(--vermilion);
    color:var(--paper);
    padding:18px 22px;
    font-size:30px;
    letter-spacing:.3em;
    border:2px solid #7d201b;
    box-shadow:0 4px 16px rgba(120,30,25,.35);
    text-align:center;
  }
  .banner .seal small{
    display:block;
    font-size:11px;
    letter-spacing:.4em;
    margin-top:8px;
    opacity:.9;
  }
  .panel{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:10px;
    max-width:520px;
  }
  .stat{
    display:flex;
    gap:18px;
    font-size:14px;
    letter-spacing:.1em;
    color:var(--ink-soft);
  }
  .stat b{ color:var(--ink); font-weight:600; }
  .divider{
    width:100%;
    height:1px;
    background:var(--line);
    opacity:.7;
  }
  button{
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--ink-soft);
    border-radius:0;               /* square, per request */
    padding:8px 14px;
    cursor:pointer;
    letter-spacing:.15em;
    transition:background .12s ease, color .12s ease;
  }
  button:hover{ background:var(--ink); color:var(--paper); }
  button.active{ background:var(--vermilion); color:var(--paper); border-color:#7d201b; }
  .diff{ display:flex; gap:8px; }
  .hint{
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-align:center;
    max-width:460px;
    line-height:1.7;
  }
</style>
</head>
<body>
  <header>
    <h1>LIFE</h1>
    <div class="sub">cross the living field</div>
  </header>

  <div class="stage">
    <div class="board">
      <canvas id="game"></canvas>
      <div class="banner" id="banner">
        <div class="seal">ARRIVED<small id="bannerSub">the field is crossed</small></div>
      </div>
    </div>

    <div class="stat">
      <span>TIME <b id="timeLabel">0.0s</b></span>
      <span>DEATHS <b id="deathLabel">0</b></span>
      <span>GEN <b id="genLabel">0</b></span>
    </div>

    <div class="panel">
      <span class="diff" id="diff">
        <button data-size="s">Small</button>
        <button data-size="m" class="active">Medium</button>
        <button data-size="l">Large</button>
      </span>
    </div>

    <div class="panel">
      <button id="newboard">New Board</button>
      <button id="reset">Reset</button>
    </div>

    <div class="divider"></div>
    <p class="hint">
      Move with <b>WASD</b> or the <b>Arrow</b> keys. Avoid the living cells &mdash; they shift every generation.<br/>
      Travel from the corner to the vermilion <b>seal</b> without standing on a live cell.
    </p>
  </div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Config. Each difficulty sets grid size, initial seed density, tick speed
  // (ms per generation), and how often "cosmic rays" are sprinkled in.
  // Edge handling: the grid is FINITE. Cells outside the bounds are treated as
  // permanently DEAD when counting neighbors (no wrap-around / no torus).
  // ---------------------------------------------------------------------------
  const SIZES = {
    s: { cols: 40, rows: 30, cell: 14, density: 0.16, tick: 150, rayEvery: 4, rayCount: 5 },
    m: { cols: 56, rows: 40, cell: 12, density: 0.14, tick: 120, rayEvery: 4, rayCount: 8 },
    l: { cols: 78, rows: 56, cell: 9, density: 0.12, tick: 95, rayEvery: 3, rayCount: 12 },
  };

  const GRACE_MS = 900;          // simulation is paused right after (re)start
  const FLASH_MS = 260;          // death flash duration

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const banner = document.getElementById("banner");
  const bannerSub = document.getElementById("bannerSub");
  const timeLabel = document.getElementById("timeLabel");
  const deathLabel = document.getElementById("deathLabel");
  const genLabel = document.getElementById("genLabel");

  let difficulty = "m";
  let cfg = SIZES[difficulty];

  let cols, rows, cell;
  let grid, next;                // Uint8Array boards (0 dead, 1 alive)
  let player, start, dest;
  let deaths, gen, steps;
  let won;
  let flashUntil = 0;
  let graceUntil = 0;
  let startTime = 0;
  let finishTime = 0;
  let acc = 0;
  let lastFrame = 0;

  const rint = (n) => Math.floor(Math.random() * n);
  const inBounds = (c, r) => c >= 0 && r >= 0 && c < cols && r < rows;
  const at = (c, r) => grid[r * cols + c];

  // Clear a (2*rad+1) square around a cell so start/dest aren't walled in.
  function clearBuffer(c, r, rad) {
    for (let dr = -rad; dr <= rad; dr++) {
      for (let dc = -rad; dc <= rad; dc++) {
        const nc = c + dc, nr = r + dr;
        if (inBounds(nc, nr)) grid[nr * cols + nc] = 0;
      }
    }
  }

  function seedBoard() {
    grid = new Uint8Array(cols * rows);
    next = new Uint8Array(cols * rows);
    for (let i = 0; i < grid.length; i++) {
      grid[i] = Math.random() < cfg.density ? 1 : 0;
    }
    // A dead buffer keeps the start and destination reachable at the outset.
    clearBuffer(start.c, start.r, 1);
    clearBuffer(dest.c, dest.r, 1);
  }

  // One generation of Conway's Game of Life (finite grid, outside = dead).
  // Rules: a live cell with 2 or 3 live neighbors survives; a dead cell with
  // exactly 3 live neighbors is born; every other cell is dead.
  //
  // Interior cells (not touching an edge) can never read out of bounds, so we
  // count their eight neighbors with flat index arithmetic and no per-neighbor
  // branching. Only the one-cell-thick border falls back to bounds-checked
  // counting. This removes the inner 3x3 loop and ~4 comparisons per neighbor.
  function step() {
    const g = grid, nx = next;
    for (let r = 1; r < rows - 1; r++) {
      let i = r * cols + 1;
      for (let c = 1; c < cols - 1; c++, i++) {
        const n =
          g[i - cols - 1] + g[i - cols] + g[i - cols + 1] +
          g[i - 1]                      + g[i + 1] +
          g[i + cols - 1] + g[i + cols] + g[i + cols + 1];
        nx[i] = (g[i] ? (n === 2 || n === 3) : (n === 3)) ? 1 : 0;
      }
    }
    // Border cells, where neighbors may lie outside the grid (treated as dead).
    for (let c = 0; c < cols; c++) { stepCell(c, 0); stepCell(c, rows - 1); }
    for (let r = 1; r < rows - 1; r++) { stepCell(0, r); stepCell(cols - 1, r); }

    const tmp = grid; grid = next; next = tmp;
  }

  function stepCell(c, r) {
    let n = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dc === 0 && dr === 0) continue;
        const nc = c + dc, nr = r + dr;
        if (nc >= 0 && nr >= 0 && nc < cols && nr < rows && grid[nr * cols + nc]) n++;
      }
    }
    const i = r * cols + c;
    next[i] = (grid[i] ? (n === 2 || n === 3) : (n === 3)) ? 1 : 0;
  }

  // Anti-stagnation: sprinkle a few random live cells so the field never dies
  // out or freezes. Never spawn on the player's current cell or the destination.
  function cosmicRays(count) {
    for (let i = 0; i < count; i++) {
      const c = rint(cols), r = rint(rows);
      // Never spawn within the 5x5 block (Chebyshev radius 2) around the player.
      if (Math.abs(c - player.c) <= 2 && Math.abs(r - player.r) <= 2) continue;
      if (c === dest.c && r === dest.r) continue;
      grid[r * cols + c] = 1;
    }
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = cols * cell * dpr;
    canvas.height = rows * cell * dpr;
    canvas.style.width = cols * cell + "px";
    canvas.style.height = rows * cell + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Full reset with a fresh random board.
  function newBoard() {
    cfg = SIZES[difficulty];
    cols = cfg.cols; rows = cfg.rows; cell = cfg.cell;
    start = { c: 1, r: rows - 2 };            // bottom-left area
    dest  = { c: cols - 2, r: 1 };            // top-right area
    seedBoard();
    deaths = 0;
    resizeCanvas();
    restartRun(true);
  }

  // Restart the current run: player back to start; keep the same board seed.
  // `resetDeaths` distinguishes New Board / difficulty (true) from a death or
  // the Reset button (false — deaths are kept so the run's toll accumulates).
  function restartRun(resetDeaths) {
    if (resetDeaths) deaths = 0;
    player = { c: start.c, r: start.r };
    gen = 0;
    steps = 0;
    won = false;
    // Ensure the player isn't spawned onto a live cell.
    clearBuffer(start.c, start.r, 1);
    const now = performance.now();
    graceUntil = now + GRACE_MS;
    startTime = now;
    finishTime = 0;
    acc = 0;
    banner.style.display = "none";
    updateStats();
  }

  function updateStats() {
    const elapsed = won
      ? (finishTime - startTime) / 1000
      : (performance.now() - startTime) / 1000;
    timeLabel.textContent = elapsed.toFixed(1) + "s";
    deathLabel.textContent = deaths;
    genLabel.textContent = gen;
  }

  function die() {
    if (won) return;
    deaths++;
    flashUntil = performance.now() + FLASH_MS;
    // Respawn at the start on the SAME board; give a brief grace period.
    player = { c: start.c, r: start.r };
    clearBuffer(start.c, start.r, 1);
    graceUntil = performance.now() + GRACE_MS;
    updateStats();
  }

  function win() {
    won = true;
    finishTime = performance.now();
    bannerSub.textContent = steps + " STEPS \u00B7 " + ((finishTime - startTime) / 1000).toFixed(1) + "s";
    banner.style.display = "flex";
    updateStats();
  }

  function tryMove(dc, dr) {
    if (won) return;
    const nc = player.c + dc, nr = player.r + dr;
    if (!inBounds(nc, nr)) return;
    player.c = nc; player.r = nr;
    steps++;
    // Moving INTO a live cell is fatal (grace period spares the player).
    if (performance.now() >= graceUntil && at(nc, nr)) {
      die();
      return;
    }
    if (nc === dest.c && nr === dest.r && !at(nc, nr)) {
      win();
    }
  }

  // ---- main loop -----------------------------------------------------------
  function frame(ts) {
    if (!lastFrame) lastFrame = ts;
    const dt = ts - lastFrame;
    lastFrame = ts;

    const inGrace = ts < graceUntil;
    if (!won && !inGrace) {
      acc += dt;
      while (acc >= cfg.tick) {
        acc -= cfg.tick;
        step();
        gen++;
        if (cfg.rayEvery > 0 && gen % cfg.rayEvery === 0) cosmicRays(cfg.rayCount);
        // If the new generation turns the player's cell alive, they die.
        if (at(player.c, player.r)) { die(); break; }
      }
    }

    if (!won) updateStats();
    draw(ts);
    requestAnimationFrame(frame);
  }

  function draw(ts) {
    const W = cols * cell, H = rows * cell;
    ctx.clearRect(0, 0, W, H);

    // live cells (deadly obstacles) — drawn as dark ink squares
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r * cols + c]) drawLive(c, r);
      }
    }

    // grid lines (over cells, under markers)
    ctx.strokeStyle = "rgba(185,172,143,.7)";
    ctx.lineWidth = 1;
    for (let c = 0; c <= cols; c++) {
      ctx.beginPath();
      ctx.moveTo(c * cell + .5, 0);
      ctx.lineTo(c * cell + .5, H);
      ctx.stroke();
    }
    for (let r = 0; r <= rows; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * cell + .5);
      ctx.lineTo(W, r * cell + .5);
      ctx.stroke();
    }

    drawStart(start.c, start.r);
    drawDest(dest.c, dest.r);
    drawPlayer(player.c, player.r);

    // death flash overlay
    if (ts < flashUntil) {
      const a = (flashUntil - ts) / FLASH_MS;
      ctx.fillStyle = "rgba(165,42,36," + (0.42 * a).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawLive(c, r) {
    const x = c * cell, y = r * cell, p = 2;
    ctx.fillStyle = "#23211c";
    ctx.fillRect(x + p, y + p, cell - 2 * p, cell - 2 * p);
  }

  function drawStart(c, r) {
    const x = c * cell, y = r * cell, p = Math.max(4, cell * 0.16);
    ctx.strokeStyle = "#6d8a72";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + p + .5, y + p + .5, cell - 2 * p - 1, cell - 2 * p - 1);
  }

  function drawDest(c, r) {
    const x = c * cell, y = r * cell, p = Math.max(3, cell * 0.12);
    ctx.fillStyle = won ? "#a52a24" : "#c1443a";
    ctx.fillRect(x + p, y + p, cell - 2 * p, cell - 2 * p);
    ctx.strokeStyle = "#7d201b";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + p + 1, y + p + 1, cell - 2 * p - 2, cell - 2 * p - 2);
    // small inner mark, echoing the vermilion seal
    ctx.strokeStyle = "rgba(239,231,213,.7)";
    ctx.lineWidth = 1;
    const q = p + Math.max(3, cell * 0.14);
    ctx.strokeRect(x + q + .5, y + q + .5, cell - 2 * q - 1, cell - 2 * q - 1);
  }

  function drawPlayer(c, r) {
    const x = c * cell, y = r * cell, p = Math.max(3, cell * 0.14);
    ctx.fillStyle = "#a52a24";
    ctx.fillRect(x + p, y + p, cell - 2 * p, cell - 2 * p);
    ctx.strokeStyle = "#efe7d5";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + p + .5, y + p + .5, cell - 2 * p - 1, cell - 2 * p - 1);
  }

  // ---- input ---------------------------------------------------------------
  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };
  window.addEventListener("keydown", (e) => {
    const mv = KEYS[e.key];
    if (!mv) return;
    e.preventDefault();
    tryMove(mv[0], mv[1]);
  });

  document.getElementById("newboard").addEventListener("click", newBoard);
  document.getElementById("reset").addEventListener("click", () => restartRun(false));
  document.getElementById("diff").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-size]");
    if (!btn) return;
    difficulty = btn.dataset.size;
    document.querySelectorAll("#diff button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    newBoard();
  });

  newBoard();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
