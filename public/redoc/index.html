<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Schema → Redoc</title>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <link rel="stylesheet" href="../tools/theme.css">
  <style>
    * { box-sizing: border-box; }
    #input-view { display: flex; flex-direction: column; gap: 8px; }
    #input-view h1 { margin: 0; font-size: 18px; }
    .subtitle { margin: 0; color: #555; }
    .input-card { width: 100%; }
    .detected-format { min-height: 18px; margin: 6px 0; color: #555; }
    .input-label { display: block; margin: 12px 0 2px; color: #555; font-size: 11px; }
    #crd-input {
      display: block; width: 100%; height: 60vh; min-height: 240px;
      padding: 8px; border: 1px solid #999; border-radius: 3px;
      background: #fff; color: #111; resize: vertical;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      tab-size: 2;
    }
    .btn-row, .sample-group, .toolbar-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .btn-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid #ccc; }
    .sample-group { margin-right: auto; }
    .btn-row button, .redoc-toolbar button, .redoc-toolbar select {
      min-height: 26px; padding: 2px 6px; border: 1px solid #999;
      border-radius: 3px; background: #fff; color: #111; font: inherit;
    }
    .btn-row button, .redoc-toolbar button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    #generate-btn { font-weight: 600; }
    #crd-input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid #555; outline-offset: 2px; }
    .error-msg { display: none; margin-top: 8px; color: #a00; white-space: pre-wrap; overflow-wrap: anywhere; }
    #redoc-view { display: none; }
    .redoc-toolbar { position: sticky; top: 0; z-index: 1000; background: #fff; padding: 8px 0; border-bottom: 1px solid #ccc; }
    .redoc-toolbar .title { font-weight: 600; }
    .kind-badge, #bundle-note { color: #555; }
    #document-select { max-width: 100%; }
    #bundle-note { margin-top: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<nav class="tool-nav" aria-label="Navigation"><a href="../tools/">← Tools</a></nav>

<!-- ── INPUT VIEW ──────────────────────────────────────── -->
<div id="input-view">
  <h1>Schema → API Docs</h1>
  <p class="subtitle">Paste a complete OpenAPI / Swagger spec, JSON Schema, or Kubernetes CRD. YAML, JSON, code fences, and multi-document bundles work here.</p>

  <div class="input-card">
    <div class="detected-format" id="detected-format" role="status">
      <!-- filled dynamically -->
    </div>
    <label class="input-label" for="crd-input">Spec or schema</label>
    <textarea id="crd-input" spellcheck="false"
      placeholder="# Paste YAML or JSON here…&#10;#&#10;# Supported formats:&#10;#   • Swagger 2.0 / OpenAPI 3.x spec (YAML or JSON)&#10;#   • JSON Schema (YAML or JSON)&#10;#   • Kubernetes CRD YAML&#10;#&#10;# The format is auto-detected."></textarea>
    <div id="error-box" class="error-msg" role="alert"></div>
    <div class="btn-row">
      <div class="sample-group">
        <button class="btn-sample swagger" onclick="loadSample('swagger')">Swagger Sample</button>
        <button class="btn-sample jsonschema" onclick="loadSample('jsonschema')">JSON Schema Sample</button>
        <button class="btn-sample crd" onclick="loadSample('crd')">CRD Sample</button>
      </div>
      <button class="btn-secondary" onclick="clearInput()">Clear</button>
      <button class="btn-primary" id="generate-btn" onclick="generate()">
        Generate Docs
      </button>
    </div>
  </div>
</div>

<!-- ── REDOC VIEW ──────────────────────────────────────── -->
<div id="redoc-view">
  <div class="redoc-toolbar">
    <div class="toolbar-controls">
      <button class="btn-secondary" onclick="goBack()">← Back</button>
      <span class="title" id="toolbar-title">API Documentation</span>
      <span class="kind-badge" id="toolbar-badge"></span>
      <label id="document-label" for="document-select" hidden>Document</label>
      <select id="document-select" onchange="renderDocument(Number(this.value))" hidden></select>
    </div>
  </div>
  <div id="bundle-note" role="status"></div>
  <div id="redoc-container"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// Auto-detect input format & render with Redoc
// ─────────────────────────────────────────────────────────

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

function hideError() {
  document.getElementById('error-box').style.display = 'none';
}

function goBack() {
  renderSequence++;
  const button = document.getElementById('generate-btn');
  button.disabled = false;
  button.textContent = 'Generate Docs';
  document.getElementById('redoc-view').style.display = 'none';
  document.getElementById('input-view').style.display = 'flex';
  document.getElementById('redoc-container').innerHTML = '';
  document.getElementById('crd-input').focus();
}

// ── Format Detection ──────────────────────────────────────

/**
 * Detect the input format. Returns one of:
 *   'openapi3'  – OpenAPI 3.x spec
 *   'swagger2'  – Swagger 2.0 spec
 *   'jsonschema' – JSON Schema document
 *   'crd'       – Kubernetes CustomResourceDefinition
 *   'unknown'
 */
function detectFormat(obj) {
  if (!obj || typeof obj !== 'object') return 'unknown';

  // OpenAPI 3.x
  if (obj.openapi && typeof obj.openapi === 'string' && obj.openapi.startsWith('3')) {
    return 'openapi3';
  }

  // Swagger 2.0
  if (obj.swagger && (obj.swagger === '2.0' || obj.swagger === 2.0)) {
    return 'swagger2';
  }

  // Kubernetes CRD
  if (obj.kind === 'CustomResourceDefinition') {
    return 'crd';
  }

  if (obj.apiVersion && obj.kind) return 'unknown';

  // JSON Schema – look for $schema keyword, or typical schema-like structure
  if (obj.$schema || obj.$id) {
    return 'jsonschema';
  }

  // Heuristic: if it has "type" and "properties" but no "paths"/"swagger"/"openapi", likely JSON Schema
  if (['type', 'properties', 'items', 'allOf', 'anyOf', 'oneOf', 'enum', '$ref', '$defs'].some(key => Object.hasOwn(obj, key)) && !obj.paths && !obj.swagger && !obj.openapi) {
    return 'jsonschema';
  }

  // Heuristic: if it has "definitions" or "properties" with nested structures
  if (obj.definitions && typeof obj.definitions === 'object' && !obj.paths) {
    return 'jsonschema';
  }

  return 'unknown';
}

function formatLabel(fmt) {
  const labels = {
    openapi3: 'OpenAPI 3.x',
    swagger2: 'Swagger 2.0',
    jsonschema: 'JSON Schema',
    crd: 'K8s CRD',
    unknown: 'Unknown format',
  };
  return labels[fmt] || fmt;
}

function formatBadgeClass(fmt) {
  if (fmt === 'openapi3' || fmt === 'swagger2') return 'swagger';
  if (fmt === 'jsonschema') return 'jsonschema';
  if (fmt === 'crd') return 'crd';
  return 'unknown';
}

// Live detection on input
let detectTimer = null;
document.getElementById('crd-input').addEventListener('input', function() {
  clearTimeout(detectTimer);
  detectTimer = setTimeout(() => updateDetectedFormat(this.value), 300);
});

// Keep each document intact so local references cannot collide across a bundle.
function parseInput(raw) {
  const text = raw.trim().replace(/^\uFEFF/, '');
  const fence = text.match(/^(`{3,}|~{3,})(?:ya?ml|json)?[^\S\n]*\r?\n([\s\S]*?)\r?\n\1$/i);
  const source = fence ? fence[2] : text;
  let documents;
  try { documents = [JSON.parse(source)]; }
  catch {
    if (typeof jsyaml === 'undefined') throw new Error('The YAML parser could not load. Check your connection and reload, or paste JSON.');
    try { documents = jsyaml.loadAll(source, null, { schema: jsyaml.JSON_SCHEMA }); }
    catch (error) { throw new Error('Invalid YAML/JSON: ' + error.message); }
  }
  const entries = [];
  let skipped = 0;
  function collect(doc) {
    if (doc == null) return;
    if (Array.isArray(doc)) { doc.forEach(collect); return; }
    if (typeof doc === 'object' && ['List', 'CustomResourceDefinitionList'].includes(doc.kind) && Array.isArray(doc.items)) {
      doc.items.forEach(collect);
      return;
    }
    // Also accept a schema copied with its Kubernetes wrapper.
    const value = doc.openAPIV3Schema || doc;
    const format = detectFormat(value);
    if (format === 'unknown') { skipped++; return; }
    const title = value.info?.title || value.metadata?.name || value.title || value.$id || formatLabel(format);
    entries.push({ value, format, title: String(title) });
  }
  documents.forEach(collect);
  if (!entries.length) throw new Error('No supported spec found. Paste an OpenAPI / Swagger spec, JSON Schema, or Kubernetes CustomResourceDefinition. Kubernetes resource instances do not contain their API schema.');
  return { entries, skipped };
}

function inputSummary({ entries, skipped }) {
  const formats = [...new Set(entries.map(entry => formatLabel(entry.format)))].join(', ');
  return `${entries.length} document${entries.length === 1 ? '' : 's'} · ${formats}` +
    (skipped ? ` · ${skipped} unsupported document${skipped === 1 ? '' : 's'} skipped` : '');
}

function updateDetectedFormat(raw) {
  const el = document.getElementById('detected-format');
  hideError();
  if (!raw.trim()) { el.textContent = ''; return; }
  try { el.textContent = inputSummary(parseInput(raw)); }
  catch { el.textContent = 'Paste a complete spec, then Generate Docs.'; }
}

function clearInput() {
  clearTimeout(detectTimer);
  document.getElementById('crd-input').value = '';
  updateDetectedFormat('');
  document.getElementById('crd-input').focus();
}

document.getElementById('crd-input').addEventListener('keydown', event => {
  if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
    event.preventDefault();
    generate();
  }
});

// ── JSON Schema → OpenAPI Wrapper ─────────────────────────

function jsonSchemaToOpenAPI(schema) {
  const title = schema.title || schema.$id || 'Schema';
  const description = schema.description || `Auto-generated API documentation for **${title}**.`;

  // Collect all definitions/schemas
  const components = { schemas: {} };

  // The main schema
  const mainSchemaName = sanitizeName(title);
  const mainSchema = convertJsonSchemaToOAS(JSON.parse(JSON.stringify(schema)));
  components.schemas[mainSchemaName] = mainSchema;

  // If the schema has definitions/$defs, pull them in
  const defs = schema.definitions || schema.$defs || {};
  for (const [name, def] of Object.entries(defs)) {
    components.schemas[name] = convertJsonSchemaToOAS(JSON.parse(JSON.stringify(def)));
  }

  // Build a minimal OpenAPI spec with CRUD-like endpoints
  const plural = mainSchemaName.toLowerCase() + 's';

  const openapi = {
    openapi: '3.0.3',
    info: {
      title: `${title} API`,
      description: description,
      version: '1.0.0',
    },
    tags: [
      { name: title, description: `Operations on **${title}** objects` },
    ],
    paths: {
      [`/${plural}`]: {
        get: {
          tags: [title],
          summary: `List all ${title} objects`,
          operationId: `list_${plural}`,
          responses: {
            '200': {
              description: 'OK',
              content: {
                'application/json': {
                  schema: {
                    type: 'array',
                    items: { $ref: `#/components/schemas/${mainSchemaName}` },
                  },
                },
              },
            },
          },
        },
        post: {
          tags: [title],
          summary: `Create a ${title}`,
          operationId: `create_${mainSchemaName.toLowerCase()}`,
          requestBody: {
            required: true,
            content: {
              'application/json': {
                schema: { $ref: `#/components/schemas/${mainSchemaName}` },
              },
            },
          },
          responses: {
            '201': {
              description: 'Created',
              content: {
                'application/json': {
                  schema: { $ref: `#/components/schemas/${mainSchemaName}` },
                },
              },
            },
          },
        },
      },
      [`/${plural}/{id}`]: {
        get: {
          tags: [title],
          summary: `Get a ${title} by ID`,
          operationId: `get_${mainSchemaName.toLowerCase()}`,
          parameters: [
            { name: 'id', in: 'path', required: true, schema: { type: 'string' }, description: `ID of the ${title}` },
          ],
          responses: {
            '200': {
              description: 'OK',
              content: {
                'application/json': {
                  schema: { $ref: `#/components/schemas/${mainSchemaName}` },
                },
              },
            },
          },
        },
        put: {
          tags: [title],
          summary: `Update a ${title}`,
          operationId: `update_${mainSchemaName.toLowerCase()}`,
          parameters: [
            { name: 'id', in: 'path', required: true, schema: { type: 'string' } },
          ],
          requestBody: {
            required: true,
            content: {
              'application/json': {
                schema: { $ref: `#/components/schemas/${mainSchemaName}` },
              },
            },
          },
          responses: {
            '200': {
              description: 'OK',
              content: {
                'application/json': {
                  schema: { $ref: `#/components/schemas/${mainSchemaName}` },
                },
              },
            },
          },
        },
        delete: {
          tags: [title],
          summary: `Delete a ${title}`,
          operationId: `delete_${mainSchemaName.toLowerCase()}`,
          parameters: [
            { name: 'id', in: 'path', required: true, schema: { type: 'string' } },
          ],
          responses: {
            '204': { description: 'Deleted' },
          },
        },
      },
    },
    components,
  };

  return openapi;
}

function sanitizeName(name) {
  return name.replace(/[^a-zA-Z0-9_]/g, '_').replace(/^_+|_+$/g, '') || 'Schema';
}

/**
 * Convert JSON Schema keywords to OAS-compatible schema.
 * Resolves $ref from definitions/$defs to #/components/schemas/...
 */
function convertJsonSchemaToOAS(schema) {
  if (!schema || typeof schema !== 'object') return schema;
  if (Array.isArray(schema)) return schema.map(convertJsonSchemaToOAS);

  // Rewrite $ref from #/definitions/X or #/$defs/X to #/components/schemas/X
  if (schema.$ref && typeof schema.$ref === 'string') {
    schema.$ref = schema.$ref
      .replace(/^#\/definitions\//, '#/components/schemas/')
      .replace(/^#\/\$defs\//, '#/components/schemas/');
    return schema;
  }

  // Remove JSON Schema keywords not in OAS 3.0
  delete schema.$schema;
  delete schema.$id;
  delete schema.definitions;
  delete schema.$defs;

  // Ensure type
  if (schema.properties && !schema.type) schema.type = 'object';
  if (schema.items && !schema.type) schema.type = 'array';

  // Recurse
  if (schema.properties) {
    for (const key of Object.keys(schema.properties)) {
      schema.properties[key] = convertJsonSchemaToOAS(schema.properties[key]);
    }
  }
  if (schema.items) schema.items = convertJsonSchemaToOAS(schema.items);
  if (schema.additionalProperties && typeof schema.additionalProperties === 'object') {
    schema.additionalProperties = convertJsonSchemaToOAS(schema.additionalProperties);
  }
  for (const kw of ['allOf', 'anyOf', 'oneOf']) {
    if (Array.isArray(schema[kw])) {
      schema[kw] = schema[kw].map(convertJsonSchemaToOAS);
    }
  }

  return schema;
}

// ── CRD → OpenAPI (existing logic) ───────────────────────

function crdToOpenAPI(crd) {
  if (!crd || crd.kind !== 'CustomResourceDefinition') {
    throw new Error('The YAML does not appear to be a CustomResourceDefinition (missing kind: CustomResourceDefinition).');
  }

  const spec = crd.spec;
  if (!spec) throw new Error('CRD is missing "spec" field.');

  const group = spec.group;
  const names = spec.names || {};
  const kind = names.kind || 'UnknownKind';
  const plural = names.plural || 'resources';
  const singular = names.singular || kind.toLowerCase();
  const listKind = names.listKind || `${kind}List`;
  const scope = spec.scope || 'Namespaced';

  const versions = spec.versions?.length ? spec.versions : (spec.version ? [{ name: spec.version, served: true }] : []);
  if (versions.length === 0) {
    throw new Error('CRD has no versions defined under spec.versions.');
  }

  const openapi = {
    openapi: '3.0.3',
    info: {
      title: `${kind} API`,
      description: buildInfoDescription(crd),
      version: versions.find(v => v.served)?.name || versions[0].name,
    },
    servers: [{ url: '/apis/' + group }],
    tags: [],
    paths: {},
    components: { schemas: {} },
  };

  for (const ver of versions) {
    if (ver.served === false) continue;

    const versionName = ver.name;
    const schema = ver.schema?.openAPIV3Schema || spec.validation?.openAPIV3Schema;
    if (!schema) throw new Error(`CRD ${kind} (${versionName}) has no OpenAPI schema.`);

    const tag = `${kind} (${versionName})`;
    openapi.tags.push({
      name: tag,
      description: `Operations on **${kind}** resources (API version \`${group}/${versionName}\`, scope: ${scope})`,
    });

    const schemaName = `${kind}_${versionName}`;
    const listSchemaName = `${listKind}_${versionName}`;

    const cleanedSchema = processSchema(JSON.parse(JSON.stringify(schema)));
    cleanedSchema['x-kubernetes-group-version-kind'] = [{ group, kind, version: versionName }];

    openapi.components.schemas[schemaName] = cleanedSchema;

    openapi.components.schemas[listSchemaName] = {
      type: 'object',
      description: `${listKind} is a list of ${kind} resources.`,
      required: ['items'],
      properties: {
        apiVersion: { type: 'string', description: 'APIVersion defines the versioned schema.' },
        kind: { type: 'string', description: 'Kind is a string value representing the REST resource.' },
        metadata: { type: 'object', description: 'Standard list metadata.' },
        items: {
          type: 'array',
          description: `List of ${kind} resources.`,
          items: { $ref: `#/components/schemas/${schemaName}` },
        },
      },
    };

    const ref = { $ref: `#/components/schemas/${schemaName}` };
    const listRef = { $ref: `#/components/schemas/${listSchemaName}` };

    if (scope === 'Namespaced') {
      const collectionPath = `/${versionName}/namespaces/{namespace}/${plural}`;
      const itemPath = `/${versionName}/namespaces/{namespace}/${plural}/{name}`;

      openapi.paths[collectionPath] = {
        get: {
          tags: [tag], summary: `List ${kind} in a namespace`, operationId: `list_${versionName}_${plural}`,
          parameters: [{ name: 'namespace', in: 'path', required: true, schema: { type: 'string' }, description: 'Namespace of the resource.' }],
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: listRef } } } },
        },
        post: {
          tags: [tag], summary: `Create a ${kind}`, operationId: `create_${versionName}_${singular}`,
          parameters: [{ name: 'namespace', in: 'path', required: true, schema: { type: 'string' }, description: 'Namespace of the resource.' }],
          requestBody: { required: true, content: { 'application/json': { schema: ref } } },
          responses: { '201': { description: 'Created', content: { 'application/json': { schema: ref } } } },
        },
      };

      openapi.paths[itemPath] = {
        get: {
          tags: [tag], summary: `Read a ${kind}`, operationId: `read_${versionName}_${singular}`,
          parameters: [
            { name: 'namespace', in: 'path', required: true, schema: { type: 'string' } },
            { name: 'name', in: 'path', required: true, schema: { type: 'string' }, description: 'Name of the resource.' },
          ],
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        put: {
          tags: [tag], summary: `Replace a ${kind}`, operationId: `replace_${versionName}_${singular}`,
          parameters: [
            { name: 'namespace', in: 'path', required: true, schema: { type: 'string' } },
            { name: 'name', in: 'path', required: true, schema: { type: 'string' } },
          ],
          requestBody: { required: true, content: { 'application/json': { schema: ref } } },
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        patch: {
          tags: [tag], summary: `Patch a ${kind}`, operationId: `patch_${versionName}_${singular}`,
          parameters: [
            { name: 'namespace', in: 'path', required: true, schema: { type: 'string' } },
            { name: 'name', in: 'path', required: true, schema: { type: 'string' } },
          ],
          requestBody: { required: true, content: { 'application/merge-patch+json': { schema: ref } } },
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        delete: {
          tags: [tag], summary: `Delete a ${kind}`, operationId: `delete_${versionName}_${singular}`,
          parameters: [
            { name: 'namespace', in: 'path', required: true, schema: { type: 'string' } },
            { name: 'name', in: 'path', required: true, schema: { type: 'string' } },
          ],
          responses: { '200': { description: 'OK' } },
        },
      };
    } else {
      const collectionPath = `/${versionName}/${plural}`;
      const itemPath = `/${versionName}/${plural}/{name}`;

      openapi.paths[collectionPath] = {
        get: {
          tags: [tag], summary: `List ${kind}`, operationId: `list_${versionName}_${plural}`,
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: listRef } } } },
        },
        post: {
          tags: [tag], summary: `Create a ${kind}`, operationId: `create_${versionName}_${singular}`,
          requestBody: { required: true, content: { 'application/json': { schema: ref } } },
          responses: { '201': { description: 'Created', content: { 'application/json': { schema: ref } } } },
        },
      };

      openapi.paths[itemPath] = {
        get: {
          tags: [tag], summary: `Read a ${kind}`, operationId: `read_${versionName}_${singular}`,
          parameters: [{ name: 'name', in: 'path', required: true, schema: { type: 'string' }, description: 'Name of the resource.' }],
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        put: {
          tags: [tag], summary: `Replace a ${kind}`, operationId: `replace_${versionName}_${singular}`,
          parameters: [{ name: 'name', in: 'path', required: true, schema: { type: 'string' } }],
          requestBody: { required: true, content: { 'application/json': { schema: ref } } },
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        patch: {
          tags: [tag], summary: `Patch a ${kind}`, operationId: `patch_${versionName}_${singular}`,
          parameters: [{ name: 'name', in: 'path', required: true, schema: { type: 'string' } }],
          requestBody: { required: true, content: { 'application/merge-patch+json': { schema: ref } } },
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        delete: {
          tags: [tag], summary: `Delete a ${kind}`, operationId: `delete_${versionName}_${singular}`,
          parameters: [{ name: 'name', in: 'path', required: true, schema: { type: 'string' } }],
          responses: { '200': { description: 'OK' } },
        },
      };
    }

    // Status sub-resource
    if ((ver.subresources || spec.subresources)?.status) {
      const statusPath = scope === 'Namespaced'
        ? `/${versionName}/namespaces/{namespace}/${plural}/{name}/status`
        : `/${versionName}/${plural}/{name}/status`;
      const params = scope === 'Namespaced'
        ? [
            { name: 'namespace', in: 'path', required: true, schema: { type: 'string' } },
            { name: 'name', in: 'path', required: true, schema: { type: 'string' } },
          ]
        : [{ name: 'name', in: 'path', required: true, schema: { type: 'string' } }];

      openapi.paths[statusPath] = {
        get: {
          tags: [tag], summary: `Read status of a ${kind}`, operationId: `read_${versionName}_${singular}_status`,
          parameters: params,
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        put: {
          tags: [tag], summary: `Replace status of a ${kind}`, operationId: `replace_${versionName}_${singular}_status`,
          parameters: params,
          requestBody: { required: true, content: { 'application/json': { schema: ref } } },
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
        patch: {
          tags: [tag], summary: `Patch status of a ${kind}`, operationId: `patch_${versionName}_${singular}_status`,
          parameters: params,
          requestBody: { required: true, content: { 'application/merge-patch+json': { schema: ref } } },
          responses: { '200': { description: 'OK', content: { 'application/json': { schema: ref } } } },
        },
      };
    }
  }

  if (!openapi.tags.length) throw new Error('CRD has no served versions with a schema.');
  return openapi;
}

function processSchema(schema) {
  if (!schema || typeof schema !== 'object') return schema;
  if (Array.isArray(schema)) return schema.map(processSchema);

  if (schema.properties && !schema.type) schema.type = 'object';
  if (schema.items && !schema.type) schema.type = 'array';

  if (schema.properties) {
    for (const key of Object.keys(schema.properties)) {
      schema.properties[key] = processSchema(schema.properties[key]);
    }
  }
  if (schema.items) schema.items = processSchema(schema.items);
  if (schema.additionalProperties && typeof schema.additionalProperties === 'object') {
    schema.additionalProperties = processSchema(schema.additionalProperties);
  }
  for (const combiner of ['allOf', 'anyOf', 'oneOf']) {
    if (Array.isArray(schema[combiner])) {
      schema[combiner] = schema[combiner].map(processSchema);
    }
  }

  return schema;
}

function buildInfoDescription(crd) {
  const spec = crd.spec;
  const names = spec.names || {};
  const group = spec.group;
  const kind = names.kind;
  const plural = names.plural;
  const scope = spec.scope || 'Namespaced';
  const versions = (spec.versions || (spec.version ? [{ name: spec.version }] : [])).filter(v => v.served !== false).map(v => v.name);

  let desc = `## ${kind}\n\n`;
  desc += `| Property | Value |\n|---|---|\n`;
  desc += `| **Group** | \`${group}\` |\n`;
  desc += `| **Kind** | \`${kind}\` |\n`;
  desc += `| **Plural** | \`${plural}\` |\n`;
  desc += `| **Scope** | ${scope} |\n`;
  desc += `| **Served Versions** | ${versions.map(v => '`' + v + '`').join(', ')} |\n`;

  if (names.shortNames?.length) {
    desc += `| **Short Names** | ${names.shortNames.map(s => '`' + s + '`').join(', ')} |\n`;
  }
  if (names.categories?.length) {
    desc += `| **Categories** | ${names.categories.join(', ')} |\n`;
  }

  return desc;
}

// ── Main generate function ────────────────────────────────

let activeBundle = null;
let renderSequence = 0;

async function generate() {
  clearTimeout(detectTimer);
  hideError();
  const raw = document.getElementById('crd-input').value;
  if (!raw.trim()) { showError('Please paste a spec or schema first.'); return; }
  try {
    activeBundle = parseInput(raw);
    const select = document.getElementById('document-select');
    select.replaceChildren();
    activeBundle.entries.forEach((entry, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${index + 1}. ${entry.title}`;
      select.appendChild(option);
    });
    select.hidden = activeBundle.entries.length < 2;
    document.getElementById('document-label').hidden = select.hidden;
    document.getElementById('bundle-note').textContent =
      activeBundle.entries.length > 1 || activeBundle.skipped ? inputSummary(activeBundle) : '';
    await renderDocument(0);
  } catch (error) { showError(error.message); }
}

async function renderDocument(index) {
  const sequence = ++renderSequence;
  const btn = document.getElementById('generate-btn');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  hideError();
  try {
    const { value, format, title } = activeBundle.entries[index];
    const openapiSpec = format === 'crd' ? crdToOpenAPI(value)
      : format === 'jsonschema' ? jsonSchemaToOpenAPI(value) : value;
    document.getElementById('input-view').style.display = 'none';
    document.getElementById('redoc-view').style.display = 'block';
    document.getElementById('toolbar-title').textContent = title;
    document.getElementById('toolbar-badge').textContent = formatLabel(format);
    document.getElementById('document-select').value = index;
    // A separate mount keeps a slow previous render from overwriting this one.
    const mount = document.createElement('div');
    mount.textContent = 'Loading Redoc…';
    document.getElementById('redoc-container').replaceChildren(mount);
    await loadRedoc();
    if (sequence !== renderSequence) return;
    await new Promise((resolve, reject) => {
      Redoc.init(openapiSpec, {
        scrollYOffset: () => document.querySelector('.redoc-toolbar').offsetHeight,
      }, mount, error => error ? reject(error) : resolve());
    });
  } catch (error) {
    if (sequence !== renderSequence) return;
    if (activeBundle.entries.length > 1) {
      document.getElementById('input-view').style.display = 'none';
      document.getElementById('redoc-view').style.display = 'block';
      document.getElementById('toolbar-title').textContent = activeBundle.entries[index].title;
      document.getElementById('toolbar-badge').textContent = formatLabel(activeBundle.entries[index].format);
      document.getElementById('document-select').value = index;
      const message = document.createElement('p');
      message.setAttribute('role', 'alert');
      message.textContent = 'Could not render this document: ' + error.message + ' Choose another document or go back to edit.';
      document.getElementById('redoc-container').replaceChildren(message);
    } else {
      document.getElementById('input-view').style.display = 'flex';
      document.getElementById('redoc-view').style.display = 'none';
      showError('Could not render this document: ' + error.message);
    }
  } finally {
    if (sequence === renderSequence || document.getElementById('redoc-view').style.display === 'none') {
      btn.disabled = false;
      btn.textContent = 'Generate Docs';
    }
  }
}

// ── Lazy-load Redoc standalone bundle ─────────────────────

let redocPromise;
function loadRedoc() {
  if (window.Redoc) return Promise.resolve();
  if (redocPromise) return redocPromise;
  redocPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js';
    script.onload = () => {
      if (window.Redoc) resolve();
      else { redocPromise = null; script.remove(); reject(new Error('Redoc did not initialize. Please try again.')); }
    };
    script.onerror = () => {
      redocPromise = null;
      script.remove();
      reject(new Error('Failed to load Redoc. Check your internet connection and try again.'));
    };
    document.head.appendChild(script);
  });
  return redocPromise;
}
